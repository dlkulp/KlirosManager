<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>My profile | Kliros Manager</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/site.js" defer></script>
  <script src="/static/profile.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Kliros Manager home"><span class="brand-mark" aria-hidden="true">K</span><span>Kliros Manager</span></a>
      <nav class="site-nav" aria-label="Main navigation"><a href="/">Home</a><a href="/library">Library</a><a href="/search">Search</a><a href="/import">Import score</a></nav>
      <div class="topbar-actions"><span class="local-label"><span class="local-dot" aria-hidden="true"></span>Local library</span><div id="account-controls" class="account-controls"></div></div>
    </div>
  </header>
  <main class="page-shell profile-shell">
    <a class="back-link" href="/library">&larr; Library</a>
    <p class="eyebrow">Account</p>
    <h1>My profile</h1>
    <p id="profile-message" class="request-status" role="status" hidden></p>
    <div id="profile-content" hidden>
      <section class="profile-summary" aria-label="User details">
        <div id="profile-initials" class="profile-avatar" aria-hidden="true"></div>
        <div class="profile-summary-copy">
          <h2 id="profile-name"></h2>
          <p id="profile-email"></p>
          <time id="profile-joined"></time>
        </div>
        <dl class="profile-counts">
          <div><dt>Uploads</dt><dd id="profile-upload-count"></dd></div>
          <div><dt>Collections</dt><dd id="profile-collection-count"></dd></div>
        </dl>
      </section>
      <section class="profile-section" aria-labelledby="uploads-heading">
        <div class="profile-section-heading">
          <div><p class="eyebrow">Your library</p><h2 id="uploads-heading">Uploads</h2></div>
          <a class="text-link" href="/import">Import score <span aria-hidden="true">&rarr;</span></a>
        </div>
        <ul id="profile-upload-list" class="profile-upload-list"></ul>
        <p id="profile-no-uploads" class="empty-state" hidden>You have not uploaded any scores yet.</p>
      </section>
      <section class="profile-section" aria-labelledby="collections-heading">
        <div class="profile-section-heading">
          <div><p class="eyebrow">Collections you own</p><h2 id="collections-heading">Collections</h2></div>
        </div>
        <div id="profile-collections"></div>
        <p id="profile-no-collections" class="empty-state" hidden>You have no collections yet.</p>
      </section>
    </div>
  </main>
</body>
</html>
